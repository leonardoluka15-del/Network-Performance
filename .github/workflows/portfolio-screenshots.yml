name: Verify portfolio and refresh screenshots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'requirements.txt'
      - 'navigation.py'
      - 'sentinel_theme.py'
      - 'performance_insights.py'
      - 'portfolio_components.py'
      - 'assets/**'
      - 'pages/**'
      - '.github/scripts/capture_portfolio.py'
      - '.github/workflows/portfolio-screenshots.yml'
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install application and browser test dependencies
        run: |
          python -m pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Run analytical and interface regression tests
        run: python -m unittest discover -s tests -v
      - name: Start app and capture actual desktop and mobile pages
        run: |
          python -m streamlit run app.py --server.headless true --browser.gatherUsageStats false > /tmp/streamlit.log 2>&1 &
          python .github/scripts/capture_portfolio.py
      - name: Preserve screenshots for review
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-screenshots
          path: docs/screenshots/
      - name: Save updated screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh verified portfolio screenshots"
            git pull --rebase origin main
            git push
          fi
      - name: Preserve diagnostics
        if: failure()
        run: cat /tmp/streamlit.log || true
